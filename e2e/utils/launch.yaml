appId: ${APP_ID}
---
- launchApp:
    clearState: true
    permissions: { all: deny }
# Location is requested only after the in-app "Enable location" action. With
# clearState + permissions denied, the system dialog should not appear here.
# Keep the conditional dismissal as a guard for platform permission-state quirks.
# Conditionally dismiss it if present. The apostrophe in "Don't Allow" is a
# Unicode right single quote (U+2019), so match by regex.
- runFlow:
    when:
      visible: "Don.*Allow"
    commands:
      - tapOn: "Don.*Allow"
